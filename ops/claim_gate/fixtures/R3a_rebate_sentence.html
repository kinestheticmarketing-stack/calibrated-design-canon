<h1>Attic insulation in Denver</h1>
<p>Xcel pays a <strong>$500</strong> rebate for attic insulation. Most homes
need about R-49 in the attic before the program will look at the job.</p>
<p>Air sealing usually comes first, because it stops the warm air before the
insulation has to.</p>
