<h1>Blower door testing index</h1>
<p>Xcel pays the rebate by check after approval, and our crews record a 20%
CFM50 reduction on a typical Denver house.</p>
<p>A blower door test measures air leakage as CFM50 by depressurizing the
house to 50 pascals, which is what makes a before-and-after pair comparable at
all.</p>
