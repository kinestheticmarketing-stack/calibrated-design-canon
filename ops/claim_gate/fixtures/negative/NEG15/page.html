<p>Homes built before 1990 in this region &mdash; see the <a href="/eaves.html">eaves guide</a> &mdash; lose 20-40% of their attic insulation performance to wind-washing at the eaves.</p>
<p class="cited-stat">According to <a href="https://buildingscience.com/documents/digests/bsd-014-air-flow-in-buildings" rel="noopener" target="_blank">Building Science Corporation</a>, wind-washing at the eaves can cost 20-40% of an attic insulation layer&rsquo;s rated performance.</p>
