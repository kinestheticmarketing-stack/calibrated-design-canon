<!DOCTYPE html><html lang="en"><head><title>Canary calculator</title></head>
<body><form id="f"><input id="sq"><output id="out"></output></form>
<script>
document.getElementById('f').addEventListener('input', function () {
  var v = parseFloat(document.getElementById('sq').value;
  document.getElementById('out').textContent = v * 2;
});
</script></body></html>
